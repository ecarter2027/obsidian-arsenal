modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# ---- REQUIRED: 3D models + item/entity animations ----
[[dependencies.${mod_id}]]
    modId="geckolib"
    mandatory=true
    versionRange="${geckolib_range}"
    ordering="AFTER"
    side="BOTH"

# ---- REQUIRED: player body animations (gauntlet combo + spell casting) ----
[[dependencies.${mod_id}]]
    modId="playeranimator"
    mandatory=true
    versionRange="${playeranimator_range}"
    ordering="AFTER"
    side="BOTH"

# ---- REQUIRED: spell system, schools, scrolls, mana ----
[[dependencies.${mod_id}]]
    modId="irons_spellbooks"
    mandatory=true
    versionRange="${irons_range}"
    ordering="AFTER"
    side="BOTH"

# ---- REQUIRED: Effekseer VFX ----
[[dependencies.${mod_id}]]
    modId="aaa_particles"
    mandatory=true
    versionRange="${aaa_range}"
    ordering="AFTER"
    side="BOTH"
